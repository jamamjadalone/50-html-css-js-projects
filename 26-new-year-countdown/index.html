<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Year Countdown Timer</title>
  <meta name="description" content="A live countdown timer showing the days, hours, minutes and seconds until the next New Year.">
  <link rel="stylesheet" href="style.css">
  <link rel="canonical" href="https://jamamjadalone.github.io/50-html-css-js-projects/26-new-year-countdown/">
  <meta name="theme-color" content="#1a1a2e">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jamamjadalone.github.io/50-html-css-js-projects/26-new-year-countdown/">
  <meta property="og:title" content="New Year Countdown Timer">
  <meta property="og:description" content="A live countdown timer showing the days, hours, minutes and seconds until the next New Year.">
  <meta property="og:site_name" content="50+ HTML CSS JS Projects">
  <meta property="og:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="New Year Countdown Timer">
  <meta name="twitter:description" content="A live countdown timer showing the days, hours, minutes and seconds until the next New Year.">
  <meta name="twitter:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg"></head>
<body>
  <div class="container">
    <h1 class="title">New Year Countdown</h1>
    <p class="subtitle">Time left until <span id="target-year" class="target-year"></span></p>
    <div class="countdown">
      <div class="box">
        <span class="number" id="days">00</span>
        <span class="label">Days</span>
      </div>
      <div class="box">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="box">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>
    <div class="party hidden" id="party">Happy New Year!</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
