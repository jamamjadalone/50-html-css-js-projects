<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Checkboxes — Settings Panel</title>
    <meta name="description" content="Custom-styled checkboxes with animated checkmark strokes, color changes, and a glowing effect.">
    <link rel="stylesheet" href="style.css">
  <link rel="canonical" href="https://jamamjadalone.github.io/50-html-css-js-projects/12-custom-checkbox-using-html-css/">
  <meta name="theme-color" content="#1a1a2e">
  <meta property="og:type" content="website">

  <meta property="og:title" content="Custom Checkboxes — Settings Panel">
  <meta property="og:description" content="Custom-styled checkboxes with animated checkmark strokes, color changes, and a glowing effect.">
  <meta property="og:site_name" content="50+ HTML CSS JS Projects">

  <meta name="twitter:title" content="Custom Checkboxes — Settings Panel">

  <meta name="twitter:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg"></head>
<body>

    <main class="panel">
        <header class="panel-header">
            <h1>Settings</h1>
            <p>Custom animated checkboxes</p>
        </header>

        <form class="settings-list" onsubmit="return false;">
            <label class="check-item">
                <input type="checkbox" checked>
                <span class="checkmark"></span>
                <span class="check-label">Dark Mode</span>
            </label>

            <label class="check-item">
                <input type="checkbox">
                <span class="checkmark"></span>
                <span class="check-label">Notifications</span>
            </label>

            <label class="check-item">
                <input type="checkbox" checked>
                <span class="checkmark"></span>
                <span class="check-label">Auto Updates</span>
            </label>

            <label class="check-item">
                <input type="checkbox">
                <span class="checkmark"></span>
                <span class="check-label">Email Alerts</span>
            </label>

            <label class="check-item">
                <input type="checkbox">
                <span class="checkmark"></span>
                <span class="check-label">Weekly Reports</span>
            </label>
        </form>
    </main>

</body>
</html>
