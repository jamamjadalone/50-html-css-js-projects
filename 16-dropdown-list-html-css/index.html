<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="A custom animated dropdown list component built with HTML, CSS and JavaScript.">

  <meta property="og:title" content="Dropdown List HTML &amp; CSS">

  <meta name="twitter:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg"></head>
<body>
  <main class="center">
    <h1>Dropdown List</h1>
    <p>Choose an option from the custom dropdown.</p>
    <div class="dropdown">
      <button class="select" id="selectBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span id="selectedLabel">Select your country</span>
        <span class="chevron">&#9662;</span>
      </button>
      <ul class="options" id="options" role="listbox">
        <li data-value="Pakistan">Pakistan</li>
        <li data-value="India">India</li>
        <li data-value="USA">United States</li>
        <li data-value="UK">United Kingdom</li>
        <li data-value="UAE">United Arab Emirates</li>
        <li data-value="Canada">Canada</li>
      </ul>
    </div>
    <p class="result" id="result">Selected: none</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
