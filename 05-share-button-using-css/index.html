<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Button using CSS - Expand on Click</title>
  <meta name="description" content="A CSS share button that expands into social media share options on hover and click.">
  <link rel="stylesheet" href="style.css">
  <link rel="canonical" href="https://jamamjadalone.github.io/50-html-css-js-projects/05-share-button-using-css/">
  <meta name="theme-color" content="#1a1a2e">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jamamjadalone.github.io/50-html-css-js-projects/05-share-button-using-css/">
  <meta property="og:title" content="Share Button using CSS - Expand on Click">
  <meta property="og:description" content="A CSS share button that expands into social media share options on hover and click.">
  <meta property="og:site_name" content="50+ HTML CSS JS Projects">
  <meta property="og:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Share Button using CSS - Expand on Click">
  <meta name="twitter:description" content="A CSS share button that expands into social media share options on hover and click.">
  <meta name="twitter:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg"></head>
<body>
  <main class="center">
    <h1>Share Button</h1>
    <p>Click or hover to reveal share options.</p>
    <div class="share-wrap">
      <div class="share-icons">
        <a href="https://facebook.com" target="_blank" rel="noopener" class="icon fb" aria-label="Share on Facebook">f</a>
        <a href="https://twitter.com" target="_blank" rel="noopener" class="icon tw" aria-label="Share on Twitter">t</a>
        <a href="https://wa.me" target="_blank" rel="noopener" class="icon wa" aria-label="Share on WhatsApp">w</a>
        <a href="https://linkedin.com" target="_blank" rel="noopener" class="icon li" aria-label="Share on LinkedIn">in</a>
      </div>
      <button class="share-btn" aria-label="Open share options">Share</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
