<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Animation Gallery — CSS Effects</title>
    <meta name="description" content="A gallery of images showcasing CSS animation effects like zoom, grayscale, shake, and ken-burns pan.">
    <link rel="stylesheet" href="style.css">
  <link rel="canonical" href="https://jamamjadalone.github.io/50-html-css-js-projects/09-image-animation-using-html-css/">
  <meta name="theme-color" content="#1a1a2e">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jamamjadalone.github.io/50-html-css-js-projects/09-image-animation-using-html-css/">
  <meta property="og:title" content="Image Animation Gallery — CSS Effects">
  <meta property="og:description" content="A gallery of images showcasing CSS animation effects like zoom, grayscale, shake, and ken-burns pan.">
  <meta property="og:site_name" content="50+ HTML CSS JS Projects">
  <meta property="og:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Image Animation Gallery — CSS Effects">
  <meta name="twitter:description" content="A gallery of images showcasing CSS animation effects like zoom, grayscale, shake, and ken-burns pan.">
  <meta name="twitter:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg"></head>
<body>

    <section class="gallery-section">
        <h1>Image Animation Gallery</h1>
        <p>Hover each image to experience its unique CSS animation.</p>

        <div class="gallery">
            <figure class="card zoom-effect">
                <img src="https://picsum.photos/seed/mountain/400/500" alt="Zoom on hover">
                <figcaption>Zoom on Hover</figcaption>
            </figure>

            <figure class="card grayscale-effect">
                <img src="https://picsum.photos/seed/ocean/400/500" alt="Grayscale to color">
                <figcaption>Grayscale to Color</figcaption>
            </figure>

            <figure class="card shake-effect">
                <img src="https://picsum.photos/seed/city/400/500" alt="Shake on hover">
                <figcaption>Shake on Hover</figcaption>
            </figure>

            <figure class="card kenburns-effect">
                <img src="https://picsum.photos/seed/forest/400/500" alt="Ken Burns pan">
                <figcaption>Slow Pan (Ken Burns)</figcaption>
            </figure>
        </div>
    </section>

</body>
</html>
