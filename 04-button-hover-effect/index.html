<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Hover Effects - CSS Animations</title>
  <meta name="description" content="Creative CSS button hover effects with slide fills, ripples, glows and animated borders.">
  <link rel="stylesheet" href="style.css">
  <link rel="canonical" href="https://jamamjadalone.github.io/50-html-css-js-projects/04-button-hover-effect/">
  <meta name="theme-color" content="#1a1a2e">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jamamjadalone.github.io/50-html-css-js-projects/04-button-hover-effect/">
  <meta property="og:title" content="Button Hover Effects - CSS Animations">
  <meta property="og:description" content="Creative CSS button hover effects with slide fills, ripples, glows and animated borders.">
  <meta property="og:site_name" content="50+ HTML CSS JS Projects">
  <meta property="og:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Button Hover Effects - CSS Animations">
  <meta name="twitter:description" content="Creative CSS button hover effects with slide fills, ripples, glows and animated borders.">
  <meta name="twitter:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg"></head>
<body>
  <main class="container">
    <header>
      <h1>Button Hover Effects</h1>
      <p>Hover over each button to see the effect.</p>
    </header>
    <section class="grid">
      <div class="demo">
        <h2>Slide Fill</h2>
        <button class="btn slide-fill">Hover Me</button>
      </div>
      <div class="demo">
        <h2>Ripple</h2>
        <button class="btn ripple">Hover Me</button>
      </div>
      <div class="demo">
        <h2>Glow</h2>
        <button class="btn glow">Hover Me</button>
      </div>
      <div class="demo">
        <h2>Border Grow</h2>
        <button class="btn border-grow">Hover Me</button>
      </div>
      <div class="demo">
        <h2>Letter Spacing</h2>
        <button class="btn letter-spacing">Hover Me</button>
      </div>
      <div class="demo">
        <h2>Swap</h2>
        <button class="btn swap"><span class="swap-top">Hover</span><span class="swap-bottom">Me</span></button>
      </div>
    </section>
  </main>
</body>
</html>
