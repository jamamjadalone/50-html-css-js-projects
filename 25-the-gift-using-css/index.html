<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gift Box</title>
    <meta name="description" content="A festive gift box drawn entirely with CSS shapes, complete with a ribbon, bow, sparkles, and a gentle wobble animation.">
    <link rel="stylesheet" href="style.css">
  <link rel="canonical" href="https://jamamjadalone.github.io/50-html-css-js-projects/25-the-gift-using-css/">
  <meta name="theme-color" content="#1a1a2e">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jamamjadalone.github.io/50-html-css-js-projects/25-the-gift-using-css/">
  <meta property="og:title" content="CSS Gift Box">
  <meta property="og:description" content="A festive gift box drawn entirely with CSS shapes, complete with a ribbon, bow, sparkles, and a gentle wobble animation.">
  <meta property="og:site_name" content="50+ HTML CSS JS Projects">
  <meta property="og:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CSS Gift Box">
  <meta name="twitter:description" content="A festive gift box drawn entirely with CSS shapes, complete with a ribbon, bow, sparkles, and a gentle wobble animation.">
  <meta name="twitter:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg"></head>
<body>
    <main class="scene">
        <h1 class="headline">For you</h1>

        <div class="sparkle sparkle-1"></div>
        <div class="sparkle sparkle-2"></div>
        <div class="sparkle sparkle-3"></div>
        <div class="sparkle sparkle-4"></div>

        <div class="gift">
            <div class="lid"></div>
            <div class="lid-ribbon-vertical"></div>
            <div class="lid-ribbon-horizontal"></div>
            <div class="bow">
                <div class="bow-loop loop-left"></div>
                <div class="bow-loop loop-right"></div>
                <div class="bow-knot"></div>
            </div>

            <div class="box"></div>
            <div class="box-ribbon-vertical"></div>
            <div class="box-ribbon-horizontal"></div>

            <div class="shine"></div>
        </div>

        <p class="hint">Hover the box to give it a shake.</p>
    </main>
</body>
</html>
