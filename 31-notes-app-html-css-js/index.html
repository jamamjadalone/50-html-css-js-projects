<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App</title>
  <meta name="description" content="A full notes app with create, edit and delete notes, color tags, search filtering and localStorage persistence.">
  <link rel="stylesheet" href="style.css">
  <link rel="canonical" href="https://jamamjadalone.github.io/50-html-css-js-projects/31-notes-app-html-css-js/">
  <meta name="theme-color" content="#1a1a2e">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jamamjadalone.github.io/50-html-css-js-projects/31-notes-app-html-css-js/">
  <meta property="og:title" content="Notes App">
  <meta property="og:description" content="A full notes app with create, edit and delete notes, color tags, search filtering and localStorage persistence.">
  <meta property="og:site_name" content="50+ HTML CSS JS Projects">
  <meta property="og:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Notes App">
  <meta name="twitter:description" content="A full notes app with create, edit and delete notes, color tags, search filtering and localStorage persistence.">
  <meta name="twitter:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg"></head>
<body>
  <div class="app">
    <header>
      <h1>Notes</h1>
      <input type="search" id="search" class="search" placeholder="Search notes...">
    </header>

    <form id="note-form" class="note-form">
      <input type="hidden" id="note-id" value="">
      <div class="row">
        <input type="text" id="note-title" placeholder="Note title" required>
        <select id="note-color" aria-label="Note color tag">
          <option value="#fde68a">Yellow</option>
          <option value="#a7f3d0">Green</option>
          <option value="#bfdbfe">Blue</option>
          <option value="#fbcfe8">Pink</option>
          <option value="#ddd6fe">Purple</option>
        </select>
      </div>
      <textarea id="note-body" placeholder="Write something..." rows="3" required></textarea>
      <div class="row actions">
        <button type="submit" id="save-btn" class="btn btn-primary">Add Note</button>
        <button type="button" id="cancel-btn" class="btn btn-ghost hidden">Cancel Edit</button>
      </div>
    </form>

    <div id="notes-grid" class="notes-grid"></div>
    <p id="empty-state" class="empty-state hidden">No notes yet. Create your first note above.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
