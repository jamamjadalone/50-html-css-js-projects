<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drawing App</title>
  <meta name="description" content="A canvas drawing app with color picker, brush size slider, eraser toggle and a clear button.">
  <link rel="stylesheet" href="style.css">
  <link rel="canonical" href="https://jamamjadalone.github.io/50-html-css-js-projects/27-drawing-app-javascript/">
  <meta name="theme-color" content="#1a1a2e">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jamamjadalone.github.io/50-html-css-js-projects/27-drawing-app-javascript/">
  <meta property="og:title" content="Drawing App">
  <meta property="og:description" content="A canvas drawing app with color picker, brush size slider, eraser toggle and a clear button.">
  <meta property="og:site_name" content="50+ HTML CSS JS Projects">
  <meta property="og:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Drawing App">
  <meta name="twitter:description" content="A canvas drawing app with color picker, brush size slider, eraser toggle and a clear button.">
  <meta name="twitter:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg"></head>
<body>
  <div class="app">
    <header class="toolbar">
      <input type="color" id="color-picker" value="#4f46e5" aria-label="Color picker">
      <div class="control">
        <label for="brush-size">Brush</label>
        <input type="range" id="brush-size" min="1" max="50" value="8">
        <span id="size-value" class="size-value">8</span>
      </div>
      <button id="eraser-btn" class="btn" type="button">Eraser</button>
      <button id="clear-btn" class="btn btn-danger" type="button">Clear</button>
    </header>
    <canvas id="canvas"></canvas>
  </div>
  <script src="script.js"></script>
</body>
</html>
