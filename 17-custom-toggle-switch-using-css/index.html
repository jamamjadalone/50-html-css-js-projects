<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Toggle Switches</title>
    <meta name="description" content="iOS-style toggle switches with animated sliding knobs and color changes, built with pure CSS.">
    <link rel="stylesheet" href="style.css">
  <link rel="canonical" href="https://jamamjadalone.github.io/50-html-css-js-projects/17-custom-toggle-switch-using-css/">
  <meta name="theme-color" content="#1a1a2e">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jamamjadalone.github.io/50-html-css-js-projects/17-custom-toggle-switch-using-css/">
  <meta property="og:title" content="Custom Toggle Switches">
  <meta property="og:description" content="iOS-style toggle switches with animated sliding knobs and color changes, built with pure CSS.">
  <meta property="og:site_name" content="50+ HTML CSS JS Projects">
  <meta property="og:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Custom Toggle Switches">
  <meta name="twitter:description" content="iOS-style toggle switches with animated sliding knobs and color changes, built with pure CSS.">
  <meta name="twitter:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg"></head>
<body>

    <main class="toggle-page">
        <h1>Toggle Switches</h1>
        <p>Click a switch to flip its state.</p>

        <section class="demo-area">

            <div class="switch-row">
                <span class="switch-label">Small switch</span>
                <label class="switch small">
                    <input type="checkbox">
                    <span class="track"></span>
                    <span class="knob"></span>
                </label>
                <span class="state-text">Off</span>
            </div>

            <div class="switch-row">
                <span class="switch-label">Large switch</span>
                <label class="switch large">
                    <input type="checkbox" checked>
                    <span class="track"></span>
                    <span class="knob"></span>
                </label>
                <span class="state-text">On</span>
            </div>

            <div class="switch-row">
                <span class="switch-label">Wi-Fi</span>
                <label class="switch blue">
                    <input type="checkbox">
                    <span class="track"></span>
                    <span class="knob"></span>
                </label>
                <span class="state-text">Off</span>
            </div>

            <div class="switch-row">
                <span class="switch-label">Bluetooth</span>
                <label class="switch green">
                    <input type="checkbox" checked>
                    <span class="track"></span>
                    <span class="knob"></span>
                </label>
                <span class="state-text">On</span>
            </div>

            <div class="switch-row">
                <span class="switch-label">Dark mode</span>
                <label class="switch purple">
                    <input type="checkbox">
                    <span class="track"></span>
                    <span class="knob"></span>
                </label>
                <span class="state-text">Off</span>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
