<body>
  <main class="center">
    <h1>Social Media Icons</h1>
    <p>Pure CSS icons with hover effects.</p>
    <div class="icons">
      <a href="https://facebook.com" target="_blank" rel="noopener" class="icon fb" aria-label="Facebook"><span></span></a>
      <a href="https://twitter.com" target="_blank" rel="noopener" class="icon tw" aria-label="Twitter"><span></span></a>
      <a href="https://instagram.com" target="_blank" rel="noopener" class="icon ig" aria-label="Instagram"><span></span></a>
      <a href="https://youtube.com" target="_blank" rel="noopener" class="icon yt" aria-label="YouTube"><span></span></a>
      <a href="https://linkedin.com" target="_blank" rel="noopener" class="icon li" aria-label="LinkedIn"><span></span></a>
      <a href="https://github.com" target="_blank" rel="noopener" class="icon gh" aria-label="GitHub"><span></span></a>
    </div>
  </main>
</body>
