<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Menu using HTML &amp; CSS</title>
  <meta name="description" content="A pure CSS navigation dropdown menu with smooth hover submenus.">
  <link rel="stylesheet" href="style.css">
  <link rel="canonical" href="https://jamamjadalone.github.io/50-html-css-js-projects/10-dropdown-menu-using-html-css/">
  <meta name="theme-color" content="#1a1a2e">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jamamjadalone.github.io/50-html-css-js-projects/10-dropdown-menu-using-html-css/">
  <meta property="og:title" content="Dropdown Menu using HTML &amp; CSS">
  <meta property="og:description" content="A pure CSS navigation dropdown menu with smooth hover submenus.">
  <meta property="og:site_name" content="50+ HTML CSS JS Projects">
  <meta property="og:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dropdown Menu using HTML &amp; CSS">
  <meta name="twitter:description" content="A pure CSS navigation dropdown menu with smooth hover submenus.">
  <meta name="twitter:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg"></head>
<body>
  <nav class="navbar">
    <div class="logo">MySite</div>
    <ul class="menu">
      <li><a href="#">Home</a></li>
      <li class="dropdown">
        <a href="#">Services <span class="arrow">&#9662;</span></a>
        <ul class="submenu">
          <li><a href="#">Web Design</a></li>
          <li><a href="#">Development</a></li>
          <li><a href="#">SEO</a></li>
          <li><a href="#">Marketing</a></li>
        </ul>
      </li>
      <li class="dropdown">
        <a href="#">About <span class="arrow">&#9662;</span></a>
        <ul class="submenu">
          <li><a href="#">Our Team</a></li>
          <li><a href="#">Careers</a></li>
          <li><a href="#">Blog</a></li>
        </ul>
      </li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
  <section class="hero">
    <h1>Dropdown Menu Demo</h1>
    <p>Hover over "Services" or "About" to see the submenu.</p>
  </section>
</body>
</html>
