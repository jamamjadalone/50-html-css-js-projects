<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Name Wave Effect</title>
    <meta name="description" content="An animated name that waves its letters in one by one with a smooth cascade effect.">
    <link rel="stylesheet" href="style.css">
  <link rel="canonical" href="https://jamamjadalone.github.io/50-html-css-js-projects/19-name-animation-using-css/">
  <meta name="theme-color" content="#1a1a2e">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jamamjadalone.github.io/50-html-css-js-projects/19-name-animation-using-css/">
  <meta property="og:title" content="Animated Name Wave Effect">
  <meta property="og:description" content="An animated name that waves its letters in one by one with a smooth cascade effect.">
  <meta property="og:site_name" content="50+ HTML CSS JS Projects">
  <meta property="og:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Animated Name Wave Effect">
  <meta name="twitter:description" content="An animated name that waves its letters in one by one with a smooth cascade effect.">
  <meta name="twitter:image" content="https://jamamjadalone.github.io/50-html-css-js-projects/og-image.svg"></head>
<body>
    <main class="stage">
        <p class="label">wave animation</p>
        <h1 class="name" aria-label="DEVELOPER">
            <span class="letter" style="--i:1">D</span>
            <span class="letter" style="--i:2">E</span>
            <span class="letter" style="--i:3">V</span>
            <span class="letter" style="--i:4">E</span>
            <span class="letter" style="--i:5">L</span>
            <span class="letter" style="--i:6">O</span>
            <span class="letter" style="--i:7">P</span>
            <span class="letter" style="--i:8">E</span>
            <span class="letter" style="--i:9">R</span>
        </h1>
        <p class="tagline">Every letter tells a story.</p>
    </main>
</body>
</html>
